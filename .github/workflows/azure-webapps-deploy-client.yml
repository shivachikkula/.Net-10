name: Build and deploy Student client to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/azure-webapps-deploy-client.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.22.3"
  BUILD_DIR: dist/client
  PUBLISH_DIR: ${{ github.workspace }}/publish
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME_CLIENT }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --watch=false

      # Points the production build at the deployed API. Set the
      # CLIENT_API_BASE_URL repository variable (e.g.
      # https://student-api-prod.azurewebsites.net/api); left unset, the
      # build keeps the committed default in src/environments/environment.ts.
      - name: Configure API base URL
        if: ${{ vars.CLIENT_API_BASE_URL != '' }}
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            apiBaseUrl: '${{ vars.CLIENT_API_BASE_URL }}',
          };
          EOF

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-client
          path: client/${{ env.BUILD_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-client
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CLIENT }}
          package: ${{ env.PUBLISH_DIR }}
